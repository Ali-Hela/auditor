# Our server standard. Every cPanel server must match this file.
#
# The built-in checks already cover the generic cPanel security checklist
# (2FA, CSF, cPHulk, backups, PHP hardening...). Only put things here that are
# specific to us, or stricter than the built-in check.
#
#   [Section]                  groups rules as "Baseline: Section"
#   type args...               a mismatch is a FAIL
#   warn:type args...          a mismatch is only a WARN
#   ... | Label                text shown in the report
#   set NAME value             a setting other checks read
#
# Values compare case-insensitively; on/yes/true/1 = off/no/false/0 opposites;
# numbers may use <=N >=N <N >N. Rule types are listed in README.md.

set ROOT_ALERT_EMAIL ""        # --fix emails root logins here (STD-ROOT-ALERT)

[Server]
os cloudlinux                                   | OS is CloudLinux
timezone Asia/Bahrain
db_engine mysql                                 | Database is MySQL (not MariaDB)

[SSH]
sshd PermitRootLogin no                         | Root cannot log in over SSH at all
sshd PermitEmptyPasswords no
warn:sshd MaxAuthTries <=4
warn:sshd X11Forwarding no

[Required software]
exists /usr/local/cpanel/whostmgr/docroot/cgi/configserver/cse /var/cpanel/apps/cse.conf | ConfigServer Explorer (CSE) is installed
package fail2ban installed
service fail2ban active
apache_module evasive                           | mod_evasive is loaded

[Apache]
apache_indexing off                             | Apache directory indexing is disabled globally
warn:file_kv /etc/apache2/conf/httpd.conf ServerTokens ProductOnly | Apache hides its version
warn:file_kv /etc/apache2/conf/httpd.conf ServerSignature Off      | Apache error pages hide the signature
warn:file_kv /etc/apache2/conf/httpd.conf TraceEnable Off

[PHP]
warn:php_ini display_errors Off

[FTP]
file_kv /etc/pure-ftpd.conf NoAnonymous yes     | Anonymous FTP is disabled
warn:file_kv /etc/pure-ftpd.conf ChrootEveryone yes | FTP users are jailed to their home
warn:file_kv /etc/pure-ftpd.conf TLS 2          | FTP requires TLS
